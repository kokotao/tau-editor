name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build (branch, tag, or SHA). Example: v0.2.0"
        required: false
        default: ""
      release_tag:
        description: "Release tag to upload assets to. Example: v0.2.0"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            runner: macos-latest
            os: macos
            args: "--target universal-apple-darwin"
            architecture: universal
            bundlePath: frontend/src-tauri/target/universal-apple-darwin/release/bundle
            bundleRoot: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: macos-aarch64
            runner: macos-latest
            os: macos
            args: "--target aarch64-apple-darwin"
            architecture: aarch64
            bundlePath: frontend/src-tauri/target/aarch64-apple-darwin/release/bundle
            bundleRoot: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            os: linux
            architecture: ""
            args: ""
            bundlePath: frontend/src-tauri/target/release/bundle
            bundleRoot: src-tauri/target/release/bundle
          - platform: windows-latest
            runner: windows-latest
            os: windows
            architecture: ""
            args: ""
            bundlePath: frontend/src-tauri/target/release/bundle
            bundleRoot: src-tauri/target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./frontend/package.json').version")"
          expected_tag="v${app_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match checked-out app version '$app_version' (expected '$expected_tag')."
            exit 1
          fi
          echo "Validated release tag $RELEASE_TAG for app version $app_version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.os == 'macos'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Configure Apple code signing
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple certificate secret configured; the bundle falls back to the ad-hoc signature from tauri.conf.json."
            exit 0
          fi

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_CERTIFICATE is set, but APPLE_SIGNING_IDENTITY is missing."
            exit 1
          fi

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::Developer ID signing requires APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID for notarization."
            exit 1
          fi

          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

          echo "Developer ID signing and notarization credentials configured."

      - name: Build Tauri bundles
        working-directory: frontend
        run: pnpm tauri build ${{ matrix.args }}

      - name: Build custom macOS DMG artifacts
        if: matrix.os == 'macos'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="${{ matrix.bundleRoot }}"
          version="$(node -p "require('./package.json').version")"

          # Tauri's default DMG does not reliably retain Finder layout metadata
          # in headless CI. Remove it and publish only the explicitly verified
          # DMG produced by package-macos-app.sh.
          find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -delete 2>/dev/null || true

          bash ../scripts/package-macos-app.sh \
            "$bundle_root" \
            "Tau.Editor" \
            "$version" \
            "${{ matrix.architecture }}"

      - name: Verify platform bundle matrix
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="${{ matrix.bundleRoot }}"
          version="$(node -p "require('./package.json').version")"
          case "${{ matrix.os }}" in
            macos)
              expected=(
                "$bundle_root/artifacts/Tau.Editor_${version}_${{ matrix.architecture }}.dmg"
                "$bundle_root/artifacts/Tau.Editor_${version}_${{ matrix.architecture }}.zip"
              )
              ;;
            linux)
              expected=(
                "$(find "$bundle_root/deb" -maxdepth 1 -type f -name "*${version}*.deb" -print -quit)"
                "$(find "$bundle_root/appimage" -maxdepth 1 -type f -name "*${version}*.AppImage" -print -quit)"
                "$(find "$bundle_root/rpm" -maxdepth 1 -type f -name "*${version}*.rpm" -print -quit)"
              )
              ;;
            windows)
              expected=(
                "$(find "$bundle_root/msi" -maxdepth 1 -type f -name "*${version}*.msi" -print -quit)"
                "$(find "$bundle_root/nsis" -maxdepth 1 -type f -name "*${version}*.exe" -print -quit)"
              )
              ;;
            *)
              echo "::error::Unsupported release OS: ${{ matrix.os }}"
              exit 1
              ;;
          esac

          missing=0
          for artifact in "${expected[@]}"; do
            if [ -z "$artifact" ] || [ ! -f "$artifact" ]; then
              echo "::error::Missing expected ${version} bundle for ${{ matrix.platform }}"
              missing=1
            else
              echo "Verified bundle: $artifact"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::The platform build did not produce the complete installer set."
            find "$bundle_root" -maxdepth 2 -type f -print | sort || true
            exit 1
          fi

      - name: Verify macOS DMG background asset
        if: matrix.os == 'macos'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          dmg_path="${{ matrix.bundleRoot }}/artifacts/Tau.Editor_${version}_${{ matrix.architecture }}.dmg"
          source_background="src-tauri/icons/dmg-background.png"

          if [ -z "$dmg_path" ] || [ ! -f "$dmg_path" ]; then
            echo "::error::Unable to locate the macOS DMG for background verification."
            exit 1
          fi
          if [ ! -f "$source_background" ]; then
            echo "::error::Missing source DMG background: $source_background"
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          attached_device=""
          cleanup() {
            if [ -n "$attached_device" ]; then
              hdiutil detach "$attached_device" >/dev/null 2>&1 || true
            else
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          attach_output="$(hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg_path")"
          attached_device="$(printf '%s\n' "$attach_output" | awk '$1 ~ /^\/dev\// {print $1; exit}')"
          embedded_background="$mount_dir/.background/dmg-background.png"
          if [ ! -f "$embedded_background" ]; then
            echo "::error::DMG does not contain .background/dmg-background.png"
            exit 1
          fi

          if ! cmp -s "$source_background" "$embedded_background"; then
            echo "::error::DMG background differs from the checked-out source asset."
            echo "Source:   $(shasum -a 256 "$source_background" | awk '{print $1}')"
            echo "Embedded: $(shasum -a 256 "$embedded_background" | awk '{print $1}')"
            exit 1
          fi

          echo "Verified DMG background: $(shasum -a 256 "$embedded_background" | awk '{print $1}')"

          embedded_ds_store="$mount_dir/.DS_Store"
          if [ ! -s "$embedded_ds_store" ]; then
            echo "::error::DMG is missing Finder layout metadata .DS_Store"
            exit 1
          fi
          echo "Verified Finder layout metadata: $(stat -f '%z' "$embedded_ds_store") bytes"

          app_in_dmg="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          source_icon="src-tauri/icons/icon.icns"
          embedded_icon="$app_in_dmg/Contents/Resources/icon.icns"
          if [ -z "$app_in_dmg" ] || [ ! -f "$source_icon" ] || [ ! -f "$embedded_icon" ]; then
            echo "::error::DMG does not contain the expected Tau Editor app icon."
            exit 1
          fi
          if ! cmp -s "$source_icon" "$embedded_icon"; then
            echo "::error::DMG app icon differs from the checked-out source asset."
            echo "Source:   $(shasum -a 256 "$source_icon" | awk '{print $1}')"
            echo "Embedded: $(shasum -a 256 "$embedded_icon" | awk '{print $1}')"
            exit 1
          fi

          echo "Verified DMG app icon: $(shasum -a 256 "$embedded_icon" | awk '{print $1}')"

          app_binary="$app_in_dmg/Contents/MacOS/text-editor"
          if [ ! -x "$app_binary" ]; then
            echo "::error::DMG app executable is missing: $app_binary"
            exit 1
          fi
          actual_arches="$(lipo -archs "$app_binary" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          case "${{ matrix.architecture }}" in
            universal)
              expected_arches="arm64 x86_64"
              ;;
            aarch64)
              expected_arches="arm64"
              ;;
          esac
          if [ "$actual_arches" != "$expected_arches" ]; then
            echo "::error::Expected ${{ matrix.architecture }} app architectures '$expected_arches', found '$actual_arches'"
            exit 1
          fi
          echo "Verified DMG app architectures (${{ matrix.architecture }}): $actual_arches"

      - name: Verify macOS code signature
        if: matrix.os == 'macos'
        working-directory: frontend
        run: |
          set -euo pipefail

          APP_PATH="$(find "${{ matrix.bundleRoot }}/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No macOS .app bundle found to verify."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
          else
            echo "Ad-hoc signature verified; macOS still asks users to allow the app once in System Settings > Privacy & Security."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundlePath }}/artifacts/*.dmg
            ${{ matrix.bundlePath }}/artifacts/*.zip
            ${{ matrix.bundlePath }}/**/*.app.tar.gz
            ${{ matrix.bundlePath }}/**/*.deb
            ${{ matrix.bundlePath }}/**/*.AppImage
            ${{ matrix.bundlePath }}/**/*.rpm
            ${{ matrix.bundlePath }}/**/*.msi
            ${{ matrix.bundlePath }}/**/*.exe

  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build-tauri
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release-assets

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes ""

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          declare -A required=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.deb) required[deb]="$file" ;;
              *.AppImage) required[appimage]="$file" ;;
              *.rpm) required[rpm]="$file" ;;
              *.msi) required[msi]="$file" ;;
              *.exe) required[exe]="$file" ;;
            esac
          done < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            -print0)

          for kind in deb appimage rpm msi exe; do
            if [ -z "${required[$kind]:-}" ]; then
              echo "::error::Release asset set is incomplete; missing ${kind} installer."
              exit 1
            fi
          done

          mapfile -t dmg_files < <(find release-assets -type f -name '*.dmg' -print | sort)
          if [ "${#dmg_files[@]}" -ne 2 ]; then
            echo "::error::Release asset set must contain exactly two macOS DMGs (universal and aarch64); found ${#dmg_files[@]}."
            printf '%s\n' "${dmg_files[@]}"
            exit 1
          fi
          for architecture in universal aarch64; do
            found=0
            for dmg_file in "${dmg_files[@]}"; do
              case "$dmg_file" in
                *_${architecture}.dmg)
                  found=1
                  break
                  ;;
              esac
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::Missing macOS ${architecture} DMG."
              exit 1
            fi
          done

          count=$(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            | wc -l | tr -d ' ')
          if [ "${count}" -eq 0 ]; then
            echo "No release files found in release-assets"
            exit 1
          fi

          echo "Uploading ${count} files to release ${RELEASE_TAG}"
          while IFS= read -r -d '' file; do
            echo "Uploading ${file}"
            gh release upload "${RELEASE_TAG}" "${file}" --clobber
          done < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            -print0)
